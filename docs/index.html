<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DewDrops Character Sheet</title>
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons: Using a specific stable version -->
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Attach to window so Babel script can see them
        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
            getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp
        };
        // Flag to signal Firebase script has run
        window.firebaseLoaded = true;
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap');
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f3f4f6;
        }
        
        .font-header {
            font-family: 'Cinzel', serif;
        }

        .dot {
            transition: all 0.2s ease;
        }
        .dot:hover {
            transform: scale(1.2);
            cursor: pointer;
        }
        
        /* Parchment effect */
        .parchment {
            background-color: #fdfbf7;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* Loading Spinner */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1e293b;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e293b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05); 
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p id="loading-text" class="text-sm font-bold animate-pulse">Initializing DewDrops...</p>
        </div>
    </div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- FALLBACK ICONS (SVG Strings) ---
        // This ensures the app never crashes to white screen even if the icon library fails
        const FallbackIcon = ({ path }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" strokeWidth="2" 
                strokeLinecap="round" strokeLinejoin="round"
                className="lucide-icon"
                style={{ width: '1em', height: '1em' }}
            >
                {path}
            </svg>
        );

        const FallbackIcons = {
            Circle: (props) => <FallbackIcon {...props} path={<circle cx="12" cy="12" r="10"/>} />,
            Save: (props) => <FallbackIcon {...props} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
            Search: (props) => <FallbackIcon {...props} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />,
            User: (props) => <FallbackIcon {...props} path={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            Shield: (props) => <FallbackIcon {...props} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>} />,
            Skull: (props) => <FallbackIcon {...props} path={<><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="M12.5 17l-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></>} />,
            Scroll: (props) => <FallbackIcon {...props} path={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><path d="M22 18c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1v-4c0-.6.4-1 1-1h1a3 3 0 0 1 2.8 2 2.7 2.7 0 0 0 2.2 1.5 2.7 2.7 0 0 0 2.2-1.5 3 3 0 0 1 2.8-2H17c.6 0 1 .4 1 1z"/></>} />,
            Sword: (props) => <FallbackIcon {...props} path={<><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></>} />,
            Sparkles: (props) => <FallbackIcon {...props} path={<><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/></>} />,
            Coins: (props) => <FallbackIcon {...props} path={<><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></>} />,
            ArrowLeft: (props) => <FallbackIcon {...props} path={<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>} />,
            Loader2: (props) => <FallbackIcon {...props} path={<path d="M21 12a9 9 0 1 1-6.219-8.56" />} />, // Simplified spinner
            Dices: (props) => <FallbackIcon {...props} path={<><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></>} />,
            AlertTriangle: (props) => <FallbackIcon {...props} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
            CloudOff: (props) => <FallbackIcon {...props} path={<><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-8.807"/><path d="M21.5 15.5a5.5 5.5 0 0 0-5.5-5.5c-1.95 0-3.665.986-4.7 2.5"/></>} />,
            Wifi: (props) => <FallbackIcon {...props} path={<path d="M5 12.55a11 11 0 0 1 14.08 0" />} />,
        };

        // --- Data Service Abstraction ---
        class DataService {
            constructor() {
                this.type = 'offline';
                this.db = null;
                this.auth = null;
                this.appId = 'dewdrops_manager';
            }

            async init() {
                try {
                    // USER PROVIDED CONFIGURATION
                    const dewdropsConfig = {
                        apiKey: "AIzaSyCtNbE5ajxLdc57G5y3Wq9bz7ZgP4bgiEE",
                        authDomain: "gamedb-903e3.firebaseapp.com",
                        projectId: "gamedb-903e3",
                        storageBucket: "gamedb-903e3.firebasestorage.app",
                        messagingSenderId: "307571396357",
                        appId: "1:307571396357:web:76358b8a778ea69932316c",
                        measurementId: "G-X1L35GCLZD"
                    };

                    if (window.firebaseModules) {
                        const app = window.firebaseModules.initializeApp(dewdropsConfig);
                        this.auth = window.firebaseModules.getAuth(app);
                        this.db = window.firebaseModules.getFirestore(app);
                        
                        try {
                            await window.firebaseModules.signInAnonymously(this.auth);
                            this.type = 'online';
                            console.log("Connected to DewDrops DB");
                            return true;
                        } catch (authErr) {
                            console.warn("Auth failed. Falling back to offline.", authErr);
                            this.type = 'offline'; 
                            return false;
                        }
                    }
                } catch (e) {
                    console.warn("Firebase Init Failed, switching to Offline Mode:", e);
                }
                this.type = 'offline';
                return false;
            }

            subscribeList(callback) {
                if (this.type === 'online' && this.db) {
                    const colRef = window.firebaseModules.collection(this.db, 'artifacts', this.appId, 'public', 'data', 'dewdrops_characters');
                    return window.firebaseModules.onSnapshot(colRef, (snapshot) => {
                        const chars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        chars.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                        callback(chars);
                    }, (err) => {
                        console.error("Snapshot error:", err);
                        callback([]);
                    });
                } else {
                    const loadLocal = () => {
                        try {
                            const raw = localStorage.getItem('dewdrops_local_chars');
                            const chars = raw ? JSON.parse(raw) : [];
                            chars.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                            callback(chars);
                        } catch(e) { callback([]); }
                    };
                    loadLocal();
                    return () => {};
                }
            }

            async saveCharacter(charData) {
                if (this.type === 'online' && this.db) {
                    const docRef = window.firebaseModules.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dewdrops_characters', charData.id);
                    await window.firebaseModules.setDoc(docRef, charData, { merge: true });
                } else {
                    const raw = localStorage.getItem('dewdrops_local_chars');
                    let chars = raw ? JSON.parse(raw) : [];
                    const idx = chars.findIndex(c => c.id === charData.id);
                    if (idx >= 0) chars[idx] = charData;
                    else chars.push(charData);
                    localStorage.setItem('dewdrops_local_chars', JSON.stringify(chars));
                    await new Promise(r => setTimeout(r, 500));
                }
            }
        }

        const dataService = new DataService();

        // --- UI Components ---
        const StatDots = ({ label, value, max, onChange, color = "text-slate-800" }) => (
            <div className="flex items-center justify-between py-1 border-b border-slate-200/50 hover:bg-slate-50 transition-colors">
                <span className="font-bold text-sm text-slate-700 uppercase tracking-wide truncate pr-2">{label}</span>
                <div className="flex gap-1 flex-shrink-0">
                    {[...Array(max)].map((_, i) => (
                        <div 
                            key={i}
                            onClick={() => onChange(i + 1 === value ? 0 : i + 1)}
                            className={`dot w-3.5 h-3.5 md:w-4 md:h-4 rounded-full border border-slate-400 flex items-center justify-center ${i < value ? `bg-slate-800 ${color}` : 'bg-transparent'}`}
                        >
                        </div>
                    ))}
                </div>
            </div>
        );

        const SectionHeader = ({ icon: Icon, title, sub }) => (
            <div className="flex items-center gap-2 mb-4 border-b-2 border-slate-800 pb-2 mt-6">
                <Icon className="w-5 h-5 md:w-6 md:h-6 text-slate-800" />
                <h2 className="text-lg md:text-xl font-header font-bold text-slate-900">{title}</h2>
                {sub && <span className="ml-auto text-xs text-slate-500 italic">{sub}</span>}
            </div>
        );

        const InputField = ({ label, value, onChange, placeholder, type = "text" }) => (
            <div className="flex flex-col gap-1 w-full">
                <label className="text-xs font-bold uppercase text-slate-500">{label}</label>
                <input 
                    type={type} 
                    value={value || ''} 
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className="w-full bg-transparent border-b border-slate-400 focus:border-slate-800 outline-none py-1 px-1 font-serif text-slate-800 transition-colors"
                />
            </div>
        );

        const DiceRoller = ({ isOpen, onClose, charData, icons }) => {
            if (!isOpen) return null;
            const { Dices } = icons;

            const [selectedStat, setSelectedStat] = useState('');
            const [selectedTrait, setSelectedTrait] = useState('');
            const [selectedFlaw, setSelectedFlaw] = useState('');
            const [rollResult, setRollResult] = useState(null);

            const calculateOutcome = () => {
                const statVal = selectedStat ? (charData.attributes[selectedStat] || 0) : 0;
                const traitVal = selectedTrait ? (charData.traits[selectedTrait] || 0) : 0;
                const flawVal = selectedFlaw ? (charData.flaws[selectedFlaw] || 0) : 0;
                
                const rangeMod = (statVal + traitVal) - flawVal;
                const minSuccess = 10 - rangeMod;
                const maxSuccess = 10 + rangeMod;
                
                const roll = Math.floor(Math.random() * 20) + 1;
                
                let outcome = '';
                let type = '';

                if (roll === 10) {
                    outcome = "CRITICAL SUCCESS";
                    type = "text-yellow-600 font-black animate-pulse";
                } else if (roll === 1) {
                    outcome = "UNDER ACTION (Crit Fail)";
                    type = "text-red-600 font-bold";
                } else if (roll === 20) {
                    outcome = "OVER ACTION (Chaos/Fail)";
                    type = "text-orange-600 font-bold";
                } else if (roll >= minSuccess && roll <= maxSuccess) {
                    outcome = "SUCCESS";
                    type = "text-green-700 font-bold";
                } else {
                    outcome = "FAILURE";
                    type = "text-slate-500";
                }

                setRollResult({
                    roll,
                    outcome,
                    type,
                    details: `Range: ${minSuccess}-${maxSuccess} (Base 10 ± ${rangeMod})`
                });
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-[#fdfbf7] p-6 rounded-lg shadow-2xl max-w-sm w-full border-4 border-slate-800" onClick={e => e.stopPropagation()}>
                        <h3 className="font-header text-xl font-bold mb-4 flex items-center gap-2"><Dices size={24} /> Mechanic Tester</h3>
                        
                        <div className="space-y-3 mb-6">
                            <select className="w-full p-2 bg-slate-100 border rounded" value={selectedStat} onChange={e => setSelectedStat(e.target.value)}>
                                <option value="">Select Attribute (Base)</option>
                                {Object.keys(charData.attributes).map(k => <option key={k} value={k}>{k} ({charData.attributes[k]})</option>)}
                            </select>
                            <select className="w-full p-2 bg-slate-100 border rounded" value={selectedTrait} onChange={e => setSelectedTrait(e.target.value)}>
                                <option value="">Select Trait (Add)</option>
                                {Object.keys(charData.traits).map(k => <option key={k} value={k}>{k} ({charData.traits[k]})</option>)}
                            </select>
                            <select className="w-full p-2 bg-red-50 border border-red-200 rounded text-red-800" value={selectedFlaw} onChange={e => setSelectedFlaw(e.target.value)}>
                                <option value="">Select Flaw (Reduce)</option>
                                {Object.keys(charData.flaws).map(k => <option key={k} value={k}>{k} ({charData.flaws[k]})</option>)}
                            </select>
                        </div>

                        <button onClick={calculateOutcome} className="w-full bg-slate-900 text-white py-3 rounded font-bold hover:bg-slate-700 transition">
                            ROLL D20
                        </button>

                        {rollResult && (
                            <div className="mt-6 text-center border-t-2 border-slate-200 pt-4">
                                <div className="text-5xl font-header font-bold text-slate-800 mb-2">{rollResult.roll}</div>
                                <div className={`text-lg uppercase tracking-wider ${rollResult.type}`}>{rollResult.outcome}</div>
                                <div className="text-xs text-slate-400 mt-1">{rollResult.details}</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            // SAFE ICON LOADING: Use FallbackIcons if the external lib fails or isn't ready
            const getIcons = () => {
                const lib = window.LucideReact || window.lucide;
                if (lib) return lib;
                return FallbackIcons;
            };
            const Icons = getIcons();
            const { 
                Circle, Save, Search, User, Shield, Skull, Scroll, 
                Sword, Sparkles, Coins, ArrowLeft, Loader2, Dices, 
                AlertTriangle, CloudOff, Wifi 
            } = Icons;

            const [view, setView] = useState('search');
            const [searchTerm, setSearchTerm] = useState('');
            const [characterList, setCharacterList] = useState([]);
            const [activeChar, setActiveChar] = useState(null);
            const [saving, setSaving] = useState(false);
            const [loadingList, setLoadingList] = useState(true);
            const [connectionType, setConnectionType] = useState('offline');
            const [showDiceModal, setShowDiceModal] = useState(false);

            useEffect(() => {
                const init = async () => {
                    await dataService.init();
                    setConnectionType(dataService.type);
                    
                    const unsubscribe = dataService.subscribeList((chars) => {
                        setCharacterList(chars);
                        setLoadingList(false);
                    });
                    return unsubscribe;
                };
                init();
            }, []);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (!searchTerm.trim()) return;

                const normalize = (str) => str.toLowerCase().trim();
                const found = characterList.find(c => normalize(c.name) === normalize(searchTerm));

                if (found) {
                    setActiveChar(found);
                    setView('sheet');
                } else {
                    const newChar = {
                        id: searchTerm.trim().replace(/\s+/g, '_').toLowerCase() + '_' + Date.now(),
                        name: searchTerm.trim(),
                        race: '',
                        age: '',
                        attributes: {
                            STR: 1, INT: 1, AGI: 1,
                            FORT: 1, WIT: 1, PERC: 1,
                            PRES: 1, MAG: 1, CHAR: 1
                        },
                        background: '',
                        reputation: { current: 0, max: 0 },
                        awards: '',
                        exp: 0,
                        traits: {
                            Melee: 0, Projectile: 0, Athletics: 0, Medicine: 0, Drive: 0,
                            Craft: 0, Mechanics: 0, Empathy: 0, Stealth: 0, Streetwise: 0,
                            Survival: 0, Perform: 0, Brave: 0, Luck: 0
                        },
                        flaws: {
                            Ego: 0, Dull: 0, Lazy: 0, Volatile: 0, Rowdy: 0,
                            Careless: 0, Clumsy: 0, Cruel: 0, Paranoid: 0,
                            Gullible: 0, Spoilt: 0, Shy: 0, Phobia: 0, Chaos: 0
                        },
                        magic: { alignment: '', mastery: '', spells: ['', '', '', ''] },
                        equipment: Array(6).fill({ type: '', name: '', effect: '' }),
                        caps: { g: 0, s: 0, c: 0 },
                        createdAt: Date.now()
                    };
                    setActiveChar(newChar);
                    setView('sheet');
                    saveCharacter(newChar);
                }
            };

            const saveCharacter = async (charData) => {
                if (!charData) return;
                setSaving(true);
                await dataService.saveCharacter(charData);
                setSaving(false);
            };

            const updateChar = (field, value, nestedKey = null, subKey = null) => {
                setActiveChar(prev => {
                    const newState = { ...prev };
                    if (nestedKey && subKey !== null) {
                        newState[nestedKey] = [...prev[nestedKey]];
                        newState[nestedKey][subKey] = { ...newState[nestedKey][subKey], ...value };
                    } else if (nestedKey) {
                        newState[nestedKey] = { ...prev[nestedKey], [field]: value };
                    } else {
                        newState[field] = value;
                    }
                    saveCharacter(newState);
                    return newState;
                });
            };

            // Render Views
            if (view === 'search') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full parchment p-8 rounded-lg shadow-xl border-t-8 border-slate-800 relative">
                             <div className="absolute top-2 right-2 text-[10px] uppercase font-bold flex items-center gap-1 text-slate-400">
                                {connectionType === 'online' ? <Wifi size={10} className="text-green-500"/> : <CloudOff size={10} className="text-slate-500"/>}
                                {connectionType === 'online' ? 'Live DB' : 'Offline Mode'}
                            </div>

                            <div className="text-center mb-8">
                                <h1 className="font-header text-4xl font-bold text-slate-900 mb-2">DewDrops</h1>
                                <p className="text-slate-600">Tabletop RPG Character Manager</p>
                            </div>
                            
                            <form onSubmit={handleSearchSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wider">Open Character</label>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="flex-1 p-3 border border-slate-300 rounded focus:border-slate-800 outline-none bg-white/50"
                                            placeholder="Enter Name..."
                                            autoFocus
                                        />
                                        <button 
                                            type="submit"
                                            className="bg-slate-800 text-white px-4 md:px-6 py-3 rounded hover:bg-slate-700 transition font-bold flex items-center gap-2 whitespace-nowrap"
                                        >
                                            <Search size={18} />
                                            Open
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2">
                                        *If the name doesn't exist, a new sheet is created.
                                    </p>
                                </div>
                            </form>

                            <div className="mt-8 border-t border-slate-200 pt-4">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                    Archive 
                                    {loadingList && <Loader2 size={14} className="animate-spin"/>}
                                </h3>
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-2">
                                    {!loadingList && characterList.length === 0 ? (
                                        <p className="text-sm text-slate-400 italic">No records found locally.</p>
                                    ) : (
                                        characterList.map(c => (
                                            <button 
                                                key={c.id} 
                                                onClick={() => { setActiveChar(c); setView('sheet'); }}
                                                className="w-full text-left p-2 hover:bg-slate-100 rounded text-slate-800 flex items-center justify-between group transition-colors border border-transparent hover:border-slate-200"
                                            >
                                                <span className="font-serif font-bold truncate">{c.name}</span>
                                                <span className="text-xs text-slate-400 group-hover:text-slate-600 shrink-0 ml-2">{c.race || '-'}</span>
                                            </button>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-2 md:p-8 flex justify-center">
                    <div className="max-w-6xl w-full parchment shadow-2xl rounded-lg p-4 md:p-10 relative">
                        
                        {/* Toolbar */}
                        <div className="flex flex-wrap gap-2 justify-between items-center mb-6 border-b-4 border-slate-900 pb-4">
                            <button 
                                onClick={() => setView('search')} 
                                className="bg-slate-800 text-white px-3 py-2 rounded hover:bg-slate-700 transition flex items-center gap-2 text-sm font-bold"
                            >
                                <ArrowLeft size={16} /> Back
                            </button>
                            
                            <h1 className="font-header text-2xl md:text-4xl font-bold text-slate-900 text-center flex-1 mx-4 hidden md:block">Character Sheet</h1>
                            
                            <div className="flex gap-2 items-center">
                                <button
                                    onClick={() => setShowDiceModal(true)}
                                    className="bg-indigo-600 text-white px-3 py-2 rounded hover:bg-indigo-700 transition flex items-center gap-2 text-sm font-bold shadow-lg transform hover:-translate-y-0.5"
                                >
                                    <Dices size={16} /> Roll
                                </button>
                                <span className={`text-xs font-bold uppercase py-2 px-3 rounded-full flex items-center gap-1 transition-all ${saving ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`}>
                                    {saving ? <><Loader2 size={12} className="animate-spin"/> Saving</> : 'Saved'}
                                </span>
                            </div>
                        </div>
                        
                        <h1 className="font-header text-3xl font-bold text-slate-900 mb-6 text-center md:hidden">Character Sheet</h1>

                        {/* Basic Info */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-white/40 p-4 rounded border border-slate-200">
                            <InputField label="Name" value={activeChar.name} onChange={(v) => updateChar('name', v)} />
                            <InputField label="Race / Clan" value={activeChar.race} onChange={(v) => updateChar('race', v)} />
                            <InputField label="Age" value={activeChar.age} onChange={(v) => updateChar('age', v)} />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Column 1 */}
                            <div className="space-y-6">
                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={User} title="Attributes" sub="+2 + Age/4" />
                                    <div className="space-y-1">
                                        {Object.keys(activeChar.attributes).map(attr => (
                                            <StatDots 
                                                key={attr} 
                                                label={attr} 
                                                value={activeChar.attributes[attr]} 
                                                max={5} 
                                                onChange={(v) => updateChar(attr, v, 'attributes')} 
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={Scroll} title="Background" />
                                    <textarea 
                                        className="w-full bg-transparent border border-slate-300 rounded p-2 h-32 text-sm resize-none focus:border-slate-800 outline-none"
                                        placeholder="History..."
                                        value={activeChar.background}
                                        onChange={(e) => updateChar('background', e.target.value)}
                                    />
                                    <div className="mt-4 space-y-4">
                                        <InputField label="Awards" value={activeChar.awards} onChange={(v) => updateChar('awards', v)} />
                                        <div className="flex gap-4">
                                            <InputField label="Reputation" value={activeChar.reputation?.current} onChange={(v) => updateChar('current', v, 'reputation')} />
                                            <InputField label="EXP" value={activeChar.exp} onChange={(v) => updateChar('exp', v)} />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Column 2 */}
                            <div className="space-y-6">
                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={Shield} title="Traits" sub="INT + 2" />
                                    <div className="space-y-1">
                                        {Object.keys(activeChar.traits).map(trait => (
                                            <StatDots 
                                                key={trait} 
                                                label={trait} 
                                                value={activeChar.traits[trait]} 
                                                max={4} 
                                                onChange={(v) => updateChar(trait, v, 'traits')} 
                                                color="text-blue-800"
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-red-50/50 p-4 rounded-lg border border-red-100">
                                    <SectionHeader icon={Skull} title="Flaws" sub="½INT + 4" />
                                    <div className="space-y-1">
                                        {Object.keys(activeChar.flaws).map(flaw => (
                                            <StatDots 
                                                key={flaw} 
                                                label={flaw} 
                                                value={activeChar.flaws[flaw]} 
                                                max={6} 
                                                onChange={(v) => updateChar(flaw, v, 'flaws')}
                                                color="text-red-800"
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Column 3 */}
                            <div className="space-y-6">
                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={Sparkles} title="Magic" />
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <InputField label="Alignment" value={activeChar.magic.alignment} onChange={(v) => updateChar('alignment', v, 'magic')} />
                                        <InputField label="Mastery" value={activeChar.magic.mastery} onChange={(v) => updateChar('mastery', v, 'magic')} />
                                    </div>
                                    <label className="text-xs font-bold uppercase text-slate-500 mb-1 block">Spells</label>
                                    <div className="space-y-2">
                                        {activeChar.magic.spells.map((spell, i) => (
                                            <input 
                                                key={i}
                                                type="text" 
                                                value={spell}
                                                onChange={(e) => {
                                                    const newSpells = [...activeChar.magic.spells];
                                                    newSpells[i] = e.target.value;
                                                    updateChar('spells', newSpells, 'magic');
                                                }}
                                                className="w-full bg-transparent border-b border-slate-300 text-sm py-1 focus:border-slate-800 outline-none"
                                                placeholder={`Spell ${i + 1}`}
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={Sword} title="Equipment" />
                                    <div className="overflow-x-auto rounded border border-slate-300">
                                        <table className="w-full text-left text-sm min-w-[300px]">
                                            <thead className="bg-slate-200 text-slate-700 text-xs uppercase">
                                                <tr>
                                                    <th className="p-2 w-1/4">Type</th>
                                                    <th className="p-2 w-1/4">Name</th>
                                                    <th className="p-2 w-1/2">Effect</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {activeChar.equipment.map((item, i) => (
                                                    <tr key={i} className="border-t border-slate-200">
                                                        <td className="p-1"><input className="w-full bg-transparent outline-none p-1" value={item.type} onChange={(e) => updateChar({ type: e.target.value }, null, 'equipment', i)} placeholder="-" /></td>
                                                        <td className="p-1"><input className="w-full bg-transparent outline-none p-1" value={item.name} onChange={(e) => updateChar({ name: e.target.value }, null, 'equipment', i)} placeholder="-" /></td>
                                                        <td className="p-1"><input className="w-full bg-transparent outline-none p-1" value={item.effect} onChange={(e) => updateChar({ effect: e.target.value }, null, 'equipment', i)} placeholder="-" /></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white/30 p-4 rounded-lg border border-slate-200/50">
                                    <SectionHeader icon={Coins} title="Caps" />
                                    <div className="flex gap-4 items-end">
                                        <div className="flex-1 text-center">
                                            <span className="text-xs text-yellow-600 font-bold block mb-1">Gold</span>
                                            <input type="number" className="w-full text-center bg-transparent border-b border-yellow-400 font-bold text-slate-800 text-lg" value={activeChar.caps.g} onChange={(e) => updateChar('g', e.target.value, 'caps')} />
                                        </div>
                                        <div className="flex-1 text-center">
                                            <span className="text-xs text-slate-400 font-bold block mb-1">Silver</span>
                                            <input type="number" className="w-full text-center bg-transparent border-b border-slate-400 font-bold text-slate-800 text-lg" value={activeChar.caps.s} onChange={(e) => updateChar('s', e.target.value, 'caps')} />
                                        </div>
                                        <div className="flex-1 text-center">
                                            <span className="text-xs text-orange-600 font-bold block mb-1">Copper</span>
                                            <input type="number" className="w-full text-center bg-transparent border-b border-orange-600 font-bold text-slate-800 text-lg" value={activeChar.caps.c} onChange={(e) => updateChar('c', e.target.value, 'caps')} />
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-4 p-4 border border-slate-300 rounded bg-slate-800 text-white">
                                    <h4 className="font-bold text-sm mb-2 flex items-center gap-2">
                                        <Sparkles size={14}/> Mechanics Reference
                                    </h4>
                                    <div className="space-y-1 text-xs text-slate-300">
                                        <p><span className="text-white font-bold">Goal:</span> Roll inside the Success Range.</p>
                                        <p><span className="text-white font-bold">Center:</span> 10</p>
                                        <p><span className="text-white font-bold">Range:</span> 10 ± (Stat + Trait - Flaw)</p>
                                        <p className="border-t border-slate-600 pt-1 mt-1 flex justify-between">
                                            <span>Crit: 10</span>
                                            <span>Over/Under: 20 / 1</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Dice Modal */}
                        <DiceRoller isOpen={showDiceModal} onClose={() => setShowDiceModal(false)} charData={activeChar} icons={Icons} />

                    </div>
                </div>
            );
        };

        // --- Safe Startup Sequence ---
        let attempts = 0;
        const startApp = () => {
            const iconsReady = window.LucideReact || window.lucide;
            const reactReady = window.React && window.ReactDOM;
            const firebaseReady = window.firebaseLoaded;

            const statusText = document.getElementById('loading-text');
            if (statusText) {
                if (!reactReady) statusText.innerText = "Waiting for React...";
                else if (!iconsReady) statusText.innerText = "Waiting for Icons...";
                else statusText.innerText = "Starting App...";
            }

            // Start immediately if React is ready. App will handle missing Icons.
            if (reactReady && firebaseReady) {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);
            } else {
                attempts++;
                // Force start after 4 seconds (80 attempts * 50ms) to prevent infinite hang
                // The Fallback Icons in <App /> ensure this won't crash even if Lucide is missing.
                if (attempts > 80) {
                    console.warn("Forcing app start due to timeout.");
                    if (window.React && window.ReactDOM) {
                         const root = ReactDOM.createRoot(document.getElementById('root'));
                         root.render(<App />);
                    }
                } else {
                    setTimeout(startApp, 50);
                }
            }
        };

        // Begin the check
        startApp();
    </script>
</body>
</html>
